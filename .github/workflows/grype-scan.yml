name: Vulnerability Scan
on:
  pull_request:
  push:
    branches:
      - main
      - master
      - 'release-*'
jobs:
  vulnerability-scan:
    name: Grype Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.19'
          cache: true
          check-latest: true

      - name: Build Docker image
        run: |
          echo "🐳 Building Docker image for vulnerability scanning..."

          # Convert repository name to lowercase for Docker tag
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "REPO_LOWER=${REPO_LOWER}" >> $GITHUB_ENV
          
          # Build the image using make command
          make build-docker-image
          
          # Tag for scanning
          docker tag telefonica/prometheus-kafka-adapter:latest ghcr.io/${REPO_LOWER}:scan

          # Verify the image was built successfully
          docker images | grep "prometheus-kafka-adapter"

          echo "✅ Docker image built successfully"

      - name: Run Grype vulnerability scanner on Docker image
        id: grype-docker
        uses: anchore/scan-action@v6
        with:
          image: "ghcr.io/${{ env.REPO_LOWER }}:scan"
          fail-build: false
          severity-cutoff: negligible
          output-format: sarif
          output-file: grype-docker-results.sarif
        continue-on-error: true

      - name: Install Grype
        run: |
          echo "📦 Installing latest Grype version..."
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

          # Verify installation and show version
          grype version
          echo "✅ Grype installed successfully"

      - name: Run Grype for human-readable output
        id: grype-summary
        run: |
          # Run grype again to get human-readable output for PR comments
          echo "📋 Running Grype for summary output..."

          # Use the environment variable set in the previous step
          grype ghcr.io/${{ env.REPO_LOWER }}:scan > grype-summary.txt 2>&1 || true

          # Show the summary
          echo "Grype Summary:"
          cat grype-summary.txt

          # Check if vulnerabilities were found
          if grep -q "No vulnerabilities found" grype-summary.txt; then
            echo "VULNERABILITIES_FOUND=false" >> $GITHUB_ENV
            echo "SUMMARY_TITLE=✅ No Vulnerabilities Found" >> $GITHUB_ENV
          else
            echo "VULNERABILITIES_FOUND=true" >> $GITHUB_ENV
            echo "SUMMARY_TITLE=⚠️ Vulnerabilities Detected" >> $GITHUB_ENV
          fi

          # Store summary in environment for PR comment
          echo "GRYPE_SUMMARY<<EOF" >> $GITHUB_ENV
          cat grype-summary.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
        continue-on-error: true

      - name: Create PR comment with vulnerability scan results
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request' && always()
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            // Read the grype summary
            let summary = process.env.GRYPE_SUMMARY || 'No scan results available';
            const title = process.env.SUMMARY_TITLE || '🔍 Vulnerability Scan Results';
            const vulnerabilitiesFound = process.env.VULNERABILITIES_FOUND === 'true';

            // Truncate summary if too long for GitHub comment (GitHub has a limit)
            if (summary.length > 60000) {
              summary = summary.substring(0, 60000) + '\n\n... (Output truncated due to length)';
            }

            // Create comment body
            const commentBody = `## ${title}

            **Scan Date:** ${new Date().toUTCString()}
            **Docker Image:** ghcr.io/${{ github.repository }}:scan
            **Scanner:** Grype

            <details>
            <summary>📋 Click to view detailed scan results</summary>

            \`\`\`
            ${summary}
            \`\`\`

            </details>

            ${vulnerabilitiesFound ? 
              '⚠️ **Action Required:** Please review the vulnerabilities found above and consider updating dependencies or applying patches.' : 
              '✅ **Great news!** No vulnerabilities were detected in this build.'
            }

            ---
            *This comment was automatically generated by the Vulnerability Scan workflow.*`;

            // Get existing comments
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            // Find existing vulnerability scan comment
            const existingComment = comments.data.find(comment => 
              comment.user.login === 'github-actions[bot]' && 
              comment.body.includes('Vulnerability Scan Results')
            );

            if (existingComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: commentBody
              });
              console.log('Updated existing vulnerability scan comment');
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
              console.log('Created new vulnerability scan comment');
            }

      - name: Archive scan results (backup)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vulnerability-scan-results
          path: |
            grype-docker-results.sarif
            grype-summary.txt
          retention-days: 7
          if-no-files-found: warn
