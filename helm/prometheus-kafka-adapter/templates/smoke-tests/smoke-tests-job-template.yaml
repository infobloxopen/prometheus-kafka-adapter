{{- if .Values.smokeTests.enabled }}
# ConfigMap containing the K6 runner Job YAML template.
# The CronJob reads this and applies it to create K6 runner Jobs
# when a HelmRelease version change is detected.
#
# Metrics pipeline:
#   1. K6 run pushes built-in metrics (k6_checks, k6_iterations, etc.) to Cortex
#   2. Custom aggregate metrics (smoke_overall_result, smoke_group_result, etc.) emitted by K6 tests
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pka-k6-job-template
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: k6-smoke-tests
    app.kubernetes.io/part-of: prometheus-kafka-adapter
    app.kubernetes.io/component: job-template
data:
  k6-runner-job.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: pka-k6-smoke-test
      namespace: {{ .Release.Namespace }}
      labels:
        app.kubernetes.io/name: k6-smoke-tests
        app.kubernetes.io/part-of: prometheus-kafka-adapter
        app.kubernetes.io/component: k6-runner
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: k6-smoke-tests
            app.kubernetes.io/part-of: prometheus-kafka-adapter
            app.kubernetes.io/component: k6-runner
        spec:
          serviceAccountName: pka-k6-smoke-test-sa
          restartPolicy: Never
          containers:
            - name: k6-runner
              image: {{ .Values.smokeTests.k6Image }}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e

                  echo "=== Prometheus-Kafka-Adapter K6 Smoke Tests ==="
                  echo "  Base URL: ${BASE_URL}"
                  echo "  Metrics -> Cortex (${K6_PROMETHEUS_RW_SERVER_URL})"
                  echo "  Tags: version=${CHART_VERSION}, service=prometheus-kafka-adapter, cluster=${CLUSTER}"
                  echo ""

                  set +e
                  k6 run /scripts/main.js \
                    --out experimental-prometheus-rw \
                    --tag version="${CHART_VERSION}" \
                    --tag service=prometheus-kafka-adapter \
                    --tag cluster="${CLUSTER}" \
                    --log-format json \
                    --verbose
                  K6_EXIT=$?
                  set -e

                  echo ""
                  echo "K6 exit code: ${K6_EXIT}"
                  echo "Metrics pushed to Cortex."
                  exit ${K6_EXIT}
              env:
                - name: BASE_URL
                  value: {{ .Values.smokeTests.baseUrl | quote }}
                - name: CLUSTER
                  value: {{ .Values.smokeTests.cluster | quote }}
                {{- if .Values.smokeTests.basicAuth.enabled }}
                - name: BASIC_AUTH_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.smokeTests.secretName }}
                      key: basic-auth-username
                - name: BASIC_AUTH_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.smokeTests.secretName }}
                      key: basic-auth-password
                {{- end }}
                - name: CHART_VERSION
                  valueFrom:
                    configMapKeyRef:
                      name: pka-smoke-test-state
                      key: last-chart-version
                - name: K6_PROMETHEUS_RW_SERVER_URL
                  value: {{ .Values.smokeTests.cortex.url | quote }}
                - name: K6_PROMETHEUS_RW_HEADERS_X-Scope-OrgID
                  value: {{ .Values.smokeTests.cortex.orgId | quote }}
                - name: K6_PROMETHEUS_RW_TREND_STATS
                  value: "avg,p(95)"
              resources:
                requests:
                  cpu: "200m"
                  memory: "256Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"
              volumeMounts:
                - name: k6-scripts
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: k6-scripts
              configMap:
                name: pka-k6-scripts
                defaultMode: 0644
{{- end }}
