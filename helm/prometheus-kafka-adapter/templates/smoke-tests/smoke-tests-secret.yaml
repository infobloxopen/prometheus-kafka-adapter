{{- if .Values.smokeTests.enabled }}
{{- if .Values.smokeTests.createSecret | default true }}
# Kubernetes Secret for prometheus-kafka-adapter K6 smoke test configuration.
#
# Contains Basic Auth credentials for the /receive endpoint.
# Credentials are injected at deploy time from Helm values.
#
# Deploy with:
#   helm upgrade pka-smoke-tests ./helm/prometheus-kafka-adapter \
#     --set smokeTests.enabled=true \
#     --set smokeTests.basicAuth.username=$BASIC_AUTH_USERNAME \
#     --set smokeTests.basicAuth.password=$BASIC_AUTH_PASSWORD
#
# To manage the secret externally, set smokeTests.createSecret=false.
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.smokeTests.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: k6-smoke-tests
    app.kubernetes.io/part-of: prometheus-kafka-adapter
    app.kubernetes.io/component: credentials
type: Opaque
stringData:
  {{- if .Values.smokeTests.basicAuth.enabled }}
  basic-auth-username: {{ .Values.smokeTests.basicAuth.username | quote }}
  basic-auth-password: {{ .Values.smokeTests.basicAuth.password | quote }}
  {{- end }}
{{- end }}
{{- end }}
